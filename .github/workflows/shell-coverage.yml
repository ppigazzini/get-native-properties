name: Shell coverage

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: shell-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  kcov:
    name: kcov (docker)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Print kcov version (docker)
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            kcov/kcov:latest-alpine \
            kcov --version

      - name: Generate coverage report (docker)
        run: |
          set -euo pipefail
          rm -rf coverage

          docker run --rm --platform linux/amd64 \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            kcov/kcov:latest-alpine \
            sh -eu -c '
              if command -v apk >/dev/null 2>&1; then
                apk add --no-cache bash coreutils findutils grep sed gawk >/dev/null 2>&1 || true
              fi

              sh scripts/kcov_get_native_properties.sh
              chmod -R a+rX coverage || true
            '

      - name: Upload kcov report
        uses: actions/upload-artifact@v4
        with:
          name: kcov-report
          path: coverage/kcov
